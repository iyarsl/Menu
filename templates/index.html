<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gemini Chat</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
  textarea { width: 100%; height: 80px; font-size: 16px; }
  button { margin-top: 10px; padding: 8px 16px; font-size: 16px; }
  #response { margin-top: 20px; white-space: pre-wrap; border-top: 1px solid #ccc; padding-top: 10px; }
</style>
</head>
<body>
  <h2>Ask Gemini</h2>
  <textarea id="prompt" placeholder="Type your prompt..."></textarea>
  <br>
  <button onclick="send()">Send</button>
  <div id="response"></div>

<script>
async function send() {
  const prompt = document.getElementById("prompt").value;
  const responseEl = document.getElementById("response");
  responseEl.textContent = "Thinking...";

  const res = await fetch("/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ prompt })
  });
  const data = await res.json();
  responseEl.textContent = data.response || ("Error: " + data.error);
}
</script>
</body>
</html>
